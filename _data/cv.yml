    - title: Research Assistant
      institution: University of Leeds
      year: 2025
      description:
        - "Project Title: Last Deglaciation Surface Temperature Reanalysis Using a Multi-Model Prior"
        - Developed a global paleoclimate data assimilation framework to reconstruct surface air temperature evolution during the last deglaciation (~21–10 ka). 
        - Integrated multi-model transient simulations (e.g. TraCE, iTraCE, MPI-ESM, MIROC4m, iLOVECLIM, LOVECLIM, HadCM3) as priors with proxy-based observations using an offline Ensemble Kalman Filter. 
        - "Technical skills: MATLAB, CLI programming, netCDF file handling, Ensemble Kalman Filter, HPC (JASMIN)"

            
    - title: National Capabilities for Global Challenges (NC-International) Program Intern
      institution: UK Center for Ecology and Hydrology
      year: 2025 
      description:
        - "Project Title: Towards a Unified Approach to Environmental Modelling"
        - Developing a Basic Model Interface to allow models written in different programming languages and built for different Earth system processes to communicate and be coupled together
        - Modernizing the Joint UK Land Environment Simulator (JULES) model by rewriting it with optimized algorithms and Machine Learning framwork 
        - "Technical skills: Fortran, CMake, CLI programming, SciPy, JAX, Equinox, process-based model development"

